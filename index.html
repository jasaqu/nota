<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nota Bata Bolong</title>
<style>
:root{--bg:#e8e7e3;--card:#f7f6f3;--ink:#1f2328;--mut:#666b73;--line:#cfcdc6;--acc:#f2b705;--dark:#27313d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a1e;--card:#21262c;--ink:#ecebe7;--mut:#9aa0a8;--line:#3a4048;--dark:#2f3b49}}
:root[data-theme="dark"]{--bg:#171a1e;--card:#21262c;--ink:#ecebe7;--mut:#9aa0a8;--line:#3a4048;--dark:#2f3b49}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:520px;margin:0 auto;padding:16px}
.top{background:var(--dark);color:#f7f6f3;padding:14px 16px;border-radius:6px;border-bottom:6px solid var(--acc);margin-bottom:14px}
.top h1{margin:0;font-size:24px}
section{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
label:first-child{margin-top:0}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:11px 10px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;font-size:20px;font-weight:700}
.tot span:last-child{font-size:30px}
.btn{width:100%;font:600 17px system-ui,sans-serif;border:0;border-radius:4px;padding:14px;cursor:pointer;background:var(--acc);color:#1f2328;margin-top:10px}
.btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
#pv{display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.65);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
#pv.on{display:block}
.pv-in{max-width:420px;margin:0 auto}
.pv-t{color:#fff;font-weight:700;margin:0 0 8px}
#nota{background:#fff;color:#000;border-radius:4px;padding:18px;font:16px/1.5 "Courier New",monospace}
@media print{
 @page{margin:10mm}
 body{background:#fff}.app,.pv-bar,.pv-t{display:none!important}
 #pv{display:block;position:static;background:none;padding:0;overflow:visible}
 .pv-in{max-width:90mm}
 #nota{padding:0;border-radius:0}
}
#nota h2{margin:0;text-align:center;font-size:20px}
#nota .c{text-align:center;font-size:13px}
#nota .bb{display:block;font-size:28px;font-weight:700;line-height:1.2;margin-bottom:2px}
#nota hr{border:0;border-top:1px dashed #000;margin:10px 0}
#nota .l{display:flex;justify-content:space-between;gap:12px;margin:3px 0}
#nota .l b:last-child,#nota .l span:last-child{text-align:right}
#nota .big{font-size:20px;font-weight:700}
</style>
</head>
<body>
<div class="app">
 <div class="top"><h1>Nota Bata Bolong</h1></div>
 <section>
  <label for="nm">Nama pembeli</label><input id="nm" autocomplete="off">
  <label for="al">Alamat</label><input id="al" autocomplete="off">
  <label for="wa">No. WhatsApp pembeli (opsional)</label><input id="wa" type="tel" inputmode="tel" autocomplete="off" placeholder="08xxxxxxxxxx">
  <div class="g2">
   <div><label for="jm">Jumlah pesanan (biji)</label><input id="jm" type="number" min="0" inputmode="numeric"></div>
   <div><label for="hg">Harga per biji (Rp)</label><input id="hg" type="number" min="0" inputmode="numeric"></div>
  </div>
  <div class="g2">
   <div><label for="mp">Sistem pembayaran</label><select id="mp"><option>COD</option><option>Transfer</option></select></div>
   <div><label for="sp">Status pembayaran</label><select id="sp"><option>Lunas</option><option>Belum lunas</option></select></div>
  </div>
  <input id="as" type="hidden">
  <div class="tot"><span>Total bayar</span><span id="tot">Rp0</span></div>
  <button class="btn" id="print">Preview nota</button>
  <button class="btn alt" id="reset">Kosongkan</button>
 </section>
</div>
<div id="pv"><div class="pv-in"><p class="pv-t">Preview nota</p><div id="nota"></div><p class="pv-t" style="margin-top:10px;font-weight:400">Lebar kertas printer: <select id="pw" style="width:auto"><option value="32">58 mm</option><option value="48">80 mm</option></select></p><div class="pv-bar"><button class="btn" id="btprint">Cetak ke Printer Bluetooth</button><button class="btn alt" id="go">Cetak lewat menu HP</button><button class="btn" id="wa-send" style="background:#25d366;color:#08210f">Kirim JPG ke WhatsApp</button><button class="btn alt" id="back">Kembali ubah data</button></div></div></div>
<script>
const $=s=>document.querySelector(s);
const rp=n=>"Rp"+new Intl.NumberFormat("id-ID").format(Math.round(n||0));
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const jml=()=>Math.max(0,parseFloat($("#jm").value)||0), hrg=()=>Math.max(0,parseFloat($("#hg").value)||0);
try{$("#hg").value=localStorage.getItem("hargaBata")||""}catch(e){}
let sv="";try{sv=localStorage.getItem("alamatJual")}catch(e){}
$("#as").value=sv||"Dusun 5 Sendangasih Kec. Sendang Agung Lampung Tengah";
function upd(){$("#tot").textContent=rp(jml()*hrg())}
function nota(){
 const d=new Date().toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"});
 $("#nota").innerHTML=`<h2>NOTA PEMBELIAN</h2><div class="c"><b class="bb">Bata Bolong</b>${esc($("#as").value)}</div><hr>
 <div class="l"><span>Tanggal</span><span>${d}</span></div>
 <div class="l"><span>Pembeli</span><span>${esc($("#nm").value)||"-"}</span></div>
 <div class="l"><span>Alamat</span><span>${esc($("#al").value)||"-"}</span></div><hr>
 <div class="l"><span>Jumlah pesanan</span><span>${new Intl.NumberFormat("id-ID").format(jml())} biji</span></div>
 <div class="l"><span>Harga per biji</span><span>${rp(hrg())}</span></div>
 <div class="l"><span>Sistem bayar</span><b>${$("#mp").value}</b></div><hr>
 <div class="l big"><span>TOTAL BAYAR</span><span>${rp(jml()*hrg())}</span></div>
 <div class="l"><span>Status</span><b>${$("#sp").value.toUpperCase()}</b></div><hr>
 <div class="c">Terima kasih atas pembelian Anda 🙏<br>Kami tunggu pesanan berikutnya.</div>`;
}
["#jm","#hg"].forEach(s=>$(s).addEventListener("input",upd));
$("#hg").addEventListener("change",()=>{try{localStorage.setItem("hargaBata",$("#hg").value)}catch(e){}});
$("#as").addEventListener("change",()=>{try{localStorage.setItem("alamatJual",$("#as").value)}catch(e){}});
$("#print").onclick=()=>{
 if(!jml()||!hrg()){alert("Isi jumlah pesanan dan harga per biji dulu.");return}
 nota();$("#pv").classList.add("on");$("#pv").scrollTop=0;pvBlob=null;notaBlob().then(b=>pvBlob=b);
};
$("#go").onclick=()=>window.print();
let btDev=null,btChar=null;
const BT_SV=["000018f0-0000-1000-8000-00805f9b34fb","0000ff00-0000-1000-8000-00805f9b34fb","0000ffe0-0000-1000-8000-00805f9b34fb","0000fee7-0000-1000-8000-00805f9b34fb","49535343-fe7d-4ae5-8fa9-9fafd205e455","e7810a71-73ae-499d-8c15-faa9aef0c3f2"];
async function btConnect(){
 if(btChar&&btDev&&btDev.gatt.connected)return btChar;
 const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:BT_SV});
 const srv=await dev.gatt.connect();
 for(const s of await srv.getPrimaryServices()){
  for(const c of await s.getCharacteristics()){
   if(c.properties.write||c.properties.writeWithoutResponse){btDev=dev;btChar=c;return c}
  }
 }
 throw new Error("Printer tidak dikenali");
}
function escpos(cols){
 const enc=new TextEncoder(),out=[];
 const raw=(...b)=>out.push(...b);
 const put=t=>out.push(...enc.encode(String(t).replace(/[^\x20-\x7E]/g,"")));
 const wrapT=(t,w)=>{const r=[];let l="";String(t).replace(/[^\x20-\x7E]/g,"").split(" ").forEach(s=>{const tt=l?l+" "+s:s;if(l&&tt.length>w){r.push(l);l=s}else l=tt});r.push(l);return r};
 const line=t=>{put(t);raw(10)};
 const hr=()=>line("-".repeat(cols));
 const kv=(k,v)=>{k=String(k);v=String(v);if(k.length+v.length+1<=cols)line(k+" ".repeat(cols-k.length-v.length)+v);else wrapT(k+": "+v,cols).forEach(line)};
 const d=new Date().toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"});
 raw(0x1b,0x40,0x1b,0x61,1,0x1b,0x45,1,0x1d,0x21,0x11);line("Bata Bolong");raw(0x1d,0x21,0,0x1b,0x45,0);
 wrapT($("#as").value,cols).forEach(line);raw(0x1b,0x61,0);hr();
 kv("Tanggal",d);kv("Pembeli",$("#nm").value||"-");kv("Alamat",$("#al").value||"-");hr();
 kv("Jumlah pesanan",new Intl.NumberFormat("id-ID").format(jml())+" biji");kv("Harga per biji",rp(hrg()));raw(0x1b,0x45,1);kv("Sistem bayar",$("#mp").value);raw(0x1b,0x45,0);hr();
 raw(0x1b,0x45,1);kv("TOTAL BAYAR",rp(jml()*hrg()));kv("Status",$("#sp").value.toUpperCase());raw(0x1b,0x45,0);hr();
 raw(0x1b,0x61,1);wrapT("Terima kasih atas pembelian Anda",cols).forEach(line);wrapT("Kami tunggu pesanan berikutnya.",cols).forEach(line);raw(0x1b,0x64,4,0x1b,0x61,0);
 return new Uint8Array(out);
}
$("#btprint").onclick=async()=>{
 const btn=$("#btprint"),t0=btn.textContent;
 try{
  if(!navigator.bluetooth)throw Object.assign(new Error("tidak didukung"),{name:"NoBT"});
  const ch=await btConnect(),data=escpos(+$("#pw").value);
  btn.textContent="Mencetak...";btn.disabled=true;
  for(let i=0;i<data.length;i+=100){
   const p=data.slice(i,i+100);
   if(ch.properties.writeWithoutResponse)await ch.writeValueWithoutResponse(p);else await ch.writeValue(p);
   await new Promise(r=>setTimeout(r,40));
  }
 }catch(e){
  btChar=null;
  if(e.name==="NotFoundError")return;
  if(e.name==="NoBT"||e.name==="SecurityError")alert("Browser atau halaman ini belum mengizinkan Bluetooth langsung. Gunakan Chrome di Android, atau pakai tombol Cetak lewat menu HP.");
  else alert("Gagal mencetak: "+e.message);
 }finally{btn.textContent=t0;btn.disabled=false}
};
function waText(){
 const d=new Date().toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"}),f=n=>new Intl.NumberFormat("id-ID").format(n);
 return ["*BATA BOLONG*",$("#as").value,"","*NOTA PEMBELIAN*","Tanggal: "+d,"Pembeli: "+($("#nm").value||"-"),"Alamat: "+($("#al").value||"-"),"",
 "Jumlah pesanan: "+f(jml())+" biji","Harga per biji: "+rp(hrg()),"Sistem bayar: "+$("#mp").value,"",
 "*TOTAL BAYAR: "+rp(jml()*hrg())+"*","Status: *"+$("#sp").value.toUpperCase()+"*","",
 "Terima kasih atas pembelian Anda \ud83d\ude4f","Kami tunggu pesanan berikutnya."].join("\n");
}
let pvBlob=null;
async function notaBlob(){
 const W=540,P=30,M='"Courier New",monospace',c=document.createElement("canvas");
 c.width=W;c.height=2400;
 const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,W,2400);x.fillStyle="#000";x.textBaseline="top";
 let y=P;
 const wrap=(t,mw)=>{const out=[];String(t).split("\n").forEach(p=>{let l="";p.split(" ").forEach(w=>{const tt=l?l+" "+w:w;if(l&&x.measureText(tt).width>mw){out.push(l);l=w}else l=tt});out.push(l)});return out};
 const ctr=(t,s,b)=>{x.font=(b?"bold ":"")+s+"px "+M;x.textAlign="center";wrap(t,W-2*P).forEach(l=>{x.fillText(l,W/2,y);y+=s*1.4})};
 const hr=()=>{y+=6;x.setLineDash([6,5]);x.lineWidth=2;x.beginPath();x.moveTo(P,y);x.lineTo(W-P,y);x.stroke();y+=18};
 const kv=(k,v,vb,s,kb)=>{s=s||22;const F=b=>(b?"bold ":"")+s+"px "+M;x.font=F(kb);const lw=x.measureText(k).width+16;x.font=F(vb);const ls=wrap(v,W-2*P-lw);x.font=F(kb);x.textAlign="left";x.fillText(k,P,y);x.font=F(vb);x.textAlign="right";ls.forEach((l,i)=>x.fillText(l,W-P,y+i*s*1.4));y+=ls.length*s*1.4};
 const d=new Date().toLocaleDateString("id-ID",{day:"2-digit",month:"long",year:"numeric"});
 ctr("Bata Bolong",42,true);ctr($("#as").value,20);hr();
 kv("Tanggal",d);kv("Pembeli",$("#nm").value||"-");kv("Alamat",$("#al").value||"-");hr();
 kv("Jumlah pesanan",new Intl.NumberFormat("id-ID").format(jml())+" biji");kv("Harga per biji",rp(hrg()));kv("Sistem bayar",$("#mp").value,true);hr();
 kv("TOTAL BAYAR",rp(jml()*hrg()),true,26,true);kv("Status",$("#sp").value.toUpperCase(),true);hr();
 ctr("Terima kasih atas pembelian Anda \ud83d\ude4f\nKami tunggu pesanan berikutnya.",20);
 const o=document.createElement("canvas");o.width=W;o.height=Math.ceil(y+P);
 const g=o.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,W,o.height);g.drawImage(c,0,0);
 return new Promise(r=>o.toBlob(r,"image/jpeg",.92));
}
$("#wa-send").onclick=async()=>{
 const blob=pvBlob||await notaBlob();
 const name="nota-"+(($("#nm").value||"pembeli").trim().replace(/[^A-Za-z0-9]+/g,"-"))+".jpg";
 const file=new File([blob],name,{type:"image/jpeg"});
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e&&e.name==="AbortError")return}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
 let n=$("#wa").value.replace(/\D/g,"");if(n.startsWith("0"))n="62"+n.slice(1);
 window.open("https://wa.me/"+n,"_blank");
 setTimeout(()=>alert("Nota JPG sudah diunduh. Lampirkan gambarnya di chat WhatsApp."),400);
};
$("#back").onclick=()=>$("#pv").classList.remove("on");
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#pv").classList.remove("on")});
$("#reset").onclick=()=>{["#nm","#al","#jm","#wa"].forEach(s=>$(s).value="");$("#mp").selectedIndex=0;$("#sp").selectedIndex=0;upd()};
upd();
</script>
</body>
</html>
